[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-buk"
version = "0.9.0"
description = "Reproducible football probability and market-value engine"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn==1.8.0",
  "catboost>=1.2",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "requests>=2.32",
  "truststore>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
model-buk = "model_buk.cli:main"
model-buk-web = "model_buk.web.api:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
